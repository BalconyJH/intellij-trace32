name: CLion plugin verification

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional release tag; must match the Gradle project version.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sdk-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check release version and repository hygiene
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python tools/test_check_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RELEASE_TAG) {
            $properties = ./gradlew.bat --no-daemon --quiet --console=plain :intellij-plugin:properties --property version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $versions = @($properties | ForEach-Object { if ($_ -match '^version:\s*(.+)$') { $Matches[1].Trim() } })
            if ($versions.Count -ne 1 -or $env:RELEASE_TAG -ne "v$($versions[0])") { throw 'Release tag does not match the Gradle project version.' }
          }
      - name: Compile, test, and package the plugin
        shell: pwsh
        run: ./gradlew.bat --no-daemon :practice-core:test :intellij-plugin:check :intellij-plugin:buildPlugin
      - name: Verify plugin API compatibility
        shell: pwsh
        run: ./gradlew.bat --no-daemon :intellij-plugin:verifyPlugin
      - name: Check distribution and generate checksum
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath intellij-plugin/build/distributions -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one plugin distribution.' }
          python tools/check_repository.py --artifact $archives[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($archives[0].FullName).sha256", "$digest  $($archives[0].Name)`n", [Text.UTF8Encoding]::new($false))
      - name: Save test and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-verification-reports
          path: |
            practice-core/build/reports/
            practice-core/build/test-results/
            intellij-plugin/build/reports/
            intellij-plugin/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified plugin and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace32-toolkit
          path: |
            intellij-plugin/build/distributions/*.zip
            intellij-plugin/build/distributions/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
