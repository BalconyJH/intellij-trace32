name: Full CLion SDK verification

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional release tag; must match the descriptor version.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sdk-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify release tag and repository hygiene
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [xml]$descriptor = Get-Content src/main/resources/META-INF/plugin.xml -Raw
          $version = $descriptor.'idea-plugin'.version
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match plugin.xml version.' }
          python tools/check_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_check_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and verify the pinned public CLion SDK
        shell: pwsh
        run: |
          $sdk = ./tools/fetch-sdk.ps1
          "CLION_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile, run all regressions and platform smoke, and package
        shell: pwsh
        run: ./build.ps1
      - name: Check distribution contents
        shell: pwsh
        run: |
          [xml]$descriptor = Get-Content src/main/resources/META-INF/plugin.xml -Raw
          $version = $descriptor.'idea-plugin'.version
          python tools/check_repository.py --artifact "build/trace32-toolkit-$version.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified plugin and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace32-toolkit
          path: |
            build/trace32-toolkit-*.zip
            build/trace32-toolkit-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
