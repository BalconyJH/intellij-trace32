name: Build and repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint GitHub Actions workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          destination="$RUNNER_TEMP/actionlint"
          mkdir -p "$destination"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern "$archive" --dir "$destination"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $destination/$archive" | sha256sum --check
          tar -xzf "$destination/$archive" -C "$destination" actionlint
          "$destination/actionlint" -shellcheck= -pyflakes=
      - name: Check repository content
        run: |
          python tools/test_check_repository.py
          python tools/check_repository.py
          git diff --check

  core:
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run language core tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew --no-daemon :practice-core:test
      - name: Run language core tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gradlew.bat --no-daemon :practice-core:test
      - name: Save core test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-tests-${{ matrix.os }}
          path: |
            practice-core/build/reports/tests/
            practice-core/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  plugin:
    needs: repository
    uses: ./.github/workflows/sdk-build.yml

  lsp:
    needs: repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install checksum-pinned t32ls
        shell: pwsh
        run: ./tools/t32ls-install.ps1
      - name: Exercise the real language server over stdio
        shell: pwsh
        run: |
          $server = (Get-Content .tools/t32ls/0.14.2/install-manifest.json -Raw | ConvertFrom-Json).executable
          python tools/t32ls-smoke.py --server $server --report build/t32ls-result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save protocol report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lsp-protocol-report
          path: build/t32ls-result.json
          if-no-files-found: error
          retention-days: 14
