name: Build and repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check repository content
        run: |
          python tools/test_check_repository.py
          python tools/check_repository.py
          git diff --check

  core:
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            gradle: ./gradlew
          - os: windows-latest
            shell: pwsh
            gradle: ./gradlew.bat
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run language core tests
        shell: ${{ matrix.shell }}
        run: ${{ matrix.gradle }} --no-daemon :practice-core:test
      - name: Save core test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-tests-${{ matrix.os }}
          path: |
            practice-core/build/reports/tests/
            practice-core/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  plugin:
    needs: repository
    uses: ./.github/workflows/sdk-build.yml

  lsp:
    needs: repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install checksum-pinned t32ls
        shell: pwsh
        run: ./tools/t32ls-install.ps1
      - name: Exercise the real language server over stdio
        shell: pwsh
        run: |
          $server = (Get-Content .tools/t32ls/0.14.2/install-manifest.json -Raw | ConvertFrom-Json).executable
          python tools/t32ls-smoke.py --server $server --report build/t32ls-result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save protocol report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lsp-protocol-report
          path: build/t32ls-result.json
          if-no-files-found: error
          retention-days: 14
