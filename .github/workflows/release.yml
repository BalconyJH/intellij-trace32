name: Package a tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Generates workflow artifacts after Gradle tests and Plugin Verifier pass.
# GitHub Releases and Marketplace publication are separate maintainer actions.
jobs:
  package:
    uses: ./.github/workflows/sdk-build.yml
    with:
      release_tag: ${{ github.ref_name }}
